spring:
  application:
    name: vanguard-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/vanguard
    driveClassName: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
